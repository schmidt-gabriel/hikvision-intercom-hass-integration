[project]
name = "hikvision-intercom-hass-integration"
version = "0.1.0"
description = "Home Assistant integration for Hikvision door stations over ISAPI"
requires-python = ">=3.12"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
  "E501",    # line-length already covers this
  # Home Assistant conventions differ from ruff in two places, and following
  # HA is worth more than following the linter:
  "N818",    # HA uses CannotConnect/InvalidAuth, without an Error suffix
  "RUF012",  # entity _attr_* attributes are lists by HA convention
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
